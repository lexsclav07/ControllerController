[project]
name = "controllercontroller"
version = "0.1.0"
description = "Control your Linux PC from bed with an Xbox controller."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["evdev>=1.7", "websockets>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
controllercontroller = "controllercontroller.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["controllercontroller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
